<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>OK Signage · Franzbrötchen · Getrennte Ebenen</title>
<style>
:root{--cream:#efc7a1}
*{box-sizing:border-box}
html,body{margin:0;background:#151516;color:#ece3d7;font:14px/1.4 system-ui,-apple-system,"Segoe UI",Arial,sans-serif}
.toolbar{max-width:1420px;margin:auto;padding:15px 14px 8px}
.toolbar strong{font-size:17px;display:block}.toolbar span{font-size:12px;color:#aeaaa5}
.workspace{width:min(96vw,1420px);margin:9px auto 0}
.frame{width:100%;aspect-ratio:1672 / 941;position:relative;overflow:hidden;outline:1px solid #4a4040;box-shadow:0 15px 60px rgba(0,0,0,.45)}
.design{position:absolute;top:0;left:0;width:1672px;height:941px;transform-origin:top left;overflow:hidden;user-select:none;background:#494340}
.background{position:absolute;inset:0;background:radial-gradient(ellipse 550px 730px at 16% 70%,#695a50 0%,#4f4543 48%,transparent 100%),radial-gradient(ellipse 1200px 950px at 80% -45%,#605655,transparent 72%),linear-gradient(130deg,#47413f,#47403f 58%,#413c3c)}
/* Hintergrund wie in kaffee-html; echtes Logo aus der freigegebenen Kaffee-Originaldatei */
.brand-logo{position:absolute;left:0;top:0;width:520px;height:290px;background:url('../assets/HBB_Kaffee_Arbeitsgrundlage_v2_Titel_10Prozent.png') 0 0 / 1672px 941px no-repeat;pointer-events:none;mask-image:radial-gradient(ellipse at 36% 30%,#000 35%,transparent 79%);-webkit-mask-image:radial-gradient(ellipse at 36% 30%,#000 35%,transparent 79%)}
/* Gebäck separat zuschaltbar; ursprüngliche freigestellte Datei nicht verformen oder neu rendern. */
.pastries{position:absolute;left:85px;top:233px;width:1055px;height:auto;object-fit:contain;filter:drop-shadow(16px 29px 23px rgba(21,14,12,.32));pointer-events:none}

.controls{display:flex;gap:8px;justify-content:flex-end;margin-top:8px}.controls button{background:#302b29;border:1px solid #635750;color:#f0ddc9;border-radius:7px;padding:8px 12px;cursor:pointer}.controls button[aria-pressed="true"]{background:#e7c6a6;color:#241e1b}.pastries[hidden]{display:none}
.footnote{width:min(96vw,1420px);margin:12px auto 35px;color:#aaa29d;font-size:12px}
@media(max-width:700px){.toolbar{padding:8px}.footnote{padding:0 8px}}
</style>
</head>
<body>
<header class="toolbar"><strong>OK Signage · Franzbrötchen</strong><span>Modulare Vorschau · Hintergrund mit Original-Logo · ohne Text und Preise</span></header>
<main class="workspace"><div class="frame" id="frame"><div class="design" id="design">
<div class="background"></div><div class="brand-logo" aria-hidden="true"></div>
<img class="pastries" src="assets/franzbroetchen_gruppe_freigestellt.png" alt="Drei freigestellte Franzbrötchen" draggable="false">

</div></div><div class="controls" role="group" aria-label="Bildebenen"><button type="button" id="backgroundOnly" aria-pressed="false">Nur Hintergrund</button><button type="button" id="withPastries" aria-pressed="true">Hintergrund + Brötchen</button></div></main>
<footer class="footnote">Zuerst Hintergrund und Original-Logo prüfen. Die freigestellten Brötchen sind unverändert und separat zuschaltbar.</footer>
<script>
'use strict';
const frame=document.getElementById('frame'),design=document.getElementById('design');
function resize(){design.style.transform='scale('+(frame.getBoundingClientRect().width/1672)+')'}
window.addEventListener('resize',resize);resize();
const pastries=document.querySelector('.pastries'),bgButton=document.getElementById('backgroundOnly'),pastryButton=document.getElementById('withPastries');
function showPastries(visible){pastries.hidden=!visible;bgButton.setAttribute('aria-pressed',String(!visible));pastryButton.setAttribute('aria-pressed',String(visible))}
bgButton.addEventListener('click',()=>showPastries(false));pastryButton.addEventListener('click',()=>showPastries(true));
</script>
</body></html>
