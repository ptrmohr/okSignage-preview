<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OK Signage · Franzbrötchen · Entwurf 03</title>
<style>
:root{color-scheme:dark;--cream:#efc7a1}
*{box-sizing:border-box}
html,body{margin:0;background:#151516;color:#ece3d7;font:14px/1.4 system-ui,-apple-system,"Segoe UI",Arial,sans-serif}
body{min-height:100vh}
.toolbar{position:relative;z-index:3;max-width:1420px;margin:auto;padding:15px 14px 8px;display:flex;align-items:center;gap:10px}
.toolbar-title{display:flex;flex-direction:column;gap:0;margin-right:auto}
.toolbar-title strong{font-size:17px}
.toolbar-title span{font-size:12px;color:#aeaaa5}
.workspace{width:min(96vw,1420px);margin:9px auto 0}
.frame{width:100%;aspect-ratio:1672/941;position:relative;overflow:hidden;outline:1px solid #4a4040;background:#45403d;box-shadow:0 15px 60px rgba(0,0,0,.45)}
.design{position:absolute;left:0;top:0;width:1672px;height:941px;transform-origin:top left;overflow:hidden;user-select:none}
.board-image{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;pointer-events:none}
.heading{position:absolute;left:740px;top:59px;color:var(--cream);font-family:Montserrat,Inter,"Arial Black","Segoe UI",Arial,sans-serif;font-size:94px;font-weight:850;line-height:1.12;letter-spacing:-.026em;white-space:nowrap}
.footnote{width:min(96vw,1420px);margin:12px auto 35px;color:#aaa29d;display:flex;gap:12px;justify-content:space-between;flex-wrap:wrap;font-size:12px}
@media(max-width:700px){.toolbar{padding:8px}.toolbar-title{width:100%}.footnote{padding:0 8px}}
</style>
</head>
<body>
<div class="toolbar">
 <div class="toolbar-title"><strong>OK Signage · Franzbrötchen</strong><span>Entwurf 03 · Drei Franzbrötchen gestaffelt · HTML-Titel · noch keine Preisboxen</span></div>
</div>
<main class="workspace">
 <div class="frame" id="frame" aria-label="Franzbrötchen Gestaltung auf Coffee-Brothers-Hintergrund">
  <div class="design" id="design">
   <img class="board-image" src="assets/franz_komposition_v03.png" alt="Drei gestaffelte Franzbrötchen auf dunklem HBB-Coffee-Brothers-Hintergrund mit schrägem Wasserzeichen" draggable="false">
   <div class="heading">Franzbrötchen</div>
  </div>
 </div>
</main>
<footer class="footnote"><span>Gestaltungsstand 03 · Hintergrund und Franzbrötchen als eigene Grafikebene, Überschrift als HTML-Text</span><span>Preise und Sortenbezeichnungen folgen später</span></footer>
<script>
'use strict';
const frame=document.getElementById('frame');
const design=document.getElementById('design');
function resize(){design.style.transform='scale('+(frame.getBoundingClientRect().width/1672)+')';}
window.addEventListener('resize',resize);resize();
</script>
</body>
</html>
