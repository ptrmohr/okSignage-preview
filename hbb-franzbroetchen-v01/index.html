<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>HBB Franzbrötchen V01 · animierter Originalhintergrund</title>
<style>
:root{--cream:#efc7a1}
*{box-sizing:border-box}
html,body{margin:0;background:#151516;color:#ece3dc;font-family:system-ui,-apple-system,"Segoe UI",Arial,sans-serif}
.workspace{width:min(100vw,1672px);margin:0 auto}
.frame{aspect-ratio:1672/941;width:100%;position:relative;overflow:hidden;outline:1px solid #615653;box-shadow:0 18px 65px #0008}
.design{position:absolute;top:0;left:0;width:1672px;height:941px;transform-origin:top left;overflow:hidden;user-select:none;isolation:isolate}
.backgroundFrame{position:absolute;inset:0;width:1672px;height:941px;border:0;pointer-events:none;background:transparent}
.heading{position:absolute;left:156px;top:45px;width:1370px;font-size:94px;font-weight:850;letter-spacing:-2.8px;white-space:nowrap;line-height:1.06;color:var(--cream);font-family:Montserrat,Inter,"Arial Black","Segoe UI",Arial,sans-serif}
.pastries{position:absolute;left:85px;top:233px;width:1055px;height:auto;object-fit:contain;filter:drop-shadow(16px 29px 23px rgba(21,14,12,.32));pointer-events:none}
</style>
</head>
<body>
<main class="workspace"><div class="frame" id="frame"><div class="design" id="design">
<iframe class="backgroundFrame" src="../hbb-hintergrund-v12/" title="Originaler HBB-Hintergrund mit langsam drehendem Engel-Logo" tabindex="-1" aria-hidden="true"></iframe>
<h1 class="heading">Franzbrötchen</h1>
<img class="pastries" src="../franzbroetchen/assets/franzbroetchen_gruppe_freigestellt.png" alt="Drei freigestellte Franzbrötchen in der bisherigen Anordnung" draggable="false">
</div></div></main>
<script>
'use strict';
const frame=document.getElementById('frame'),design=document.getElementById('design');
function resize(){design.style.transform='scale('+(frame.getBoundingClientRect().width/1672)+')'}
window.addEventListener('resize',resize);resize();
</script>
</body></html>
