<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>HBB – Original-Engel Hintergrund V01 · bestätigte Gestaltung</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;background:#171617;color:#e8d5c7;font:14px system-ui,sans-serif}
.frame{position:relative;width:100%;aspect-ratio:1672/941;overflow:hidden;perspective:1400px;
background:radial-gradient(ellipse 550px 730px at 16% 70%,#695a50 0%,#4f4543 48%,transparent 100%),radial-gradient(ellipse 1200px 950px at 80% -45%,#605655,transparent 72%),linear-gradient(130deg,#47413f,#47403f 58%,#413c3c)}
.logo{position:absolute;left:-8%;top:24%;width:112%;height:auto;opacity:.16;transform-origin:50% 75%;
transform:rotate(-26deg) rotateX(30deg);
mask-image:linear-gradient(to top,#000 42%,transparent 100%);
-webkit-mask-image:linear-gradient(to top,#000 42%,transparent 100%);
pointer-events:none;user-select:none}
.note{max-width:1672px;margin:14px auto;padding:0 15px;color:#b5aba4}
</style>
</head>
<body>
<main class="frame"><img class="logo" src="assets/coffee_brothers_original.png" alt="Originales Coffee-Brothers-Engel-Logo" draggable="false"></main>
<div class="note">HBB Hintergrund V01 · Original-Logo · 30° perspektivisch nach hinten · doppelte Größe und unten beschnitten · Hintergrund und Logo als getrennte Ebenen. Keine Kaffeeprodukte oder Preislisten.</div>
</body>
</html>
